<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>H — Durable Agent Harness</title>
    <link rel="stylesheet" href="./app.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div id="auth-bar" class="auth-bar" hidden>
      <form id="auth-form" class="auth-form">
        <label for="auth-token-input" class="auth-label">
          Authentication required. Paste owner token from <code>&lt;data_dir&gt;/auth.token</code>:
        </label>
        <input
          id="auth-token-input"
          class="input auth-input"
          type="password"
          autocomplete="off"
          placeholder="Owner token..."
          required
        />
        <button type="submit" class="btn btn-primary">Authenticate</button>
        <span id="auth-error" class="auth-error" hidden></span>
      </form>
    </div>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <span class="brand-mark">H</span>
            <span class="brand-sub">harness</span>
          </div>
          <button id="toggle-new-session-btn" type="button" class="btn btn-sm btn-secondary">
            + New Session
          </button>
        </div>

        <form id="new-session-form" class="new-session-form" hidden>
          <div class="field">
            <label for="new-session-id">Session ID</label>
            <input
              id="new-session-id"
              class="input"
              type="text"
              placeholder="demo-session"
              required
            />
          </div>
          <div class="field">
            <label for="new-session-cwd">Working Directory (abs path)</label>
            <input
              id="new-session-cwd"
              class="input mono"
              type="text"
              placeholder="/path/to/repo"
              required
            />
          </div>
          <div class="field">
            <label for="new-session-model">Model</label>
            <select id="new-session-model" class="select"></select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-sm btn-primary">Create</button>
            <button id="cancel-new-session-btn" type="button" class="btn btn-sm btn-ghost">
              Cancel
            </button>
          </div>
        </form>

        <section class="sidebar-section">
          <div class="section-title-row">
            <h2 class="section-title">Sessions</h2>
            <button id="refresh-sessions-btn" type="button" class="btn-icon" title="Refresh sessions">
              ↻
            </button>
          </div>
          <ul id="sessions-list" class="sessions-list"></ul>
        </section>

        <section id="branches-section" class="sidebar-section" hidden>
          <h2 class="section-title">Conversations</h2>
          <div id="branches-tree" class="branches-tree"></div>
        </section>

        <section id="config-section" class="sidebar-section config-section" hidden>
          <h2 class="section-title">Agent Config</h2>
          <div class="field">
            <label for="model-select">Model</label>
            <select id="model-select" class="select"></select>
          </div>
          <div class="field">
            <label for="thinking-select">Thinking</label>
            <select id="thinking-select" class="select">
              <option value="off">off</option>
              <option value="minimal">minimal</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="xhigh">xhigh</option>
            </select>
          </div>
          <div id="config-status" class="config-status" hidden></div>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="topbar-meta">
            <span id="hdr-session" class="meta-chip mono">No session</span>
            <span id="hdr-cwd" class="meta-cwd mono" hidden></span>
            <span id="hdr-conv" class="meta-chip mono" hidden></span>
            <span id="hdr-seq" class="meta-chip mono" hidden></span>
            <span id="hdr-usage" class="meta-chip mono" hidden></span>
          </div>
          <div class="topbar-controls">
            <span id="conn-badge" class="conn-badge status-idle">Idle</span>
            <button id="stop-btn" type="button" class="btn btn-sm btn-danger" hidden>
              Stop (Esc)
            </button>
          </div>
        </header>

        <div id="error-banner" class="error-banner" hidden>
          <span id="error-banner-text"></span>
          <button id="error-banner-dismiss" type="button" class="btn btn-sm btn-ghost">Dismiss</button>
        </div>

        <section id="transcript-scroll" class="transcript">
          <div id="empty-state" class="empty-state">
            Select a session or create a new one to begin.
          </div>

          <div id="load-earlier-wrap" class="load-earlier-wrap" hidden>
            <button id="load-earlier-btn" type="button" class="btn btn-sm btn-secondary">
              Load earlier
            </button>
          </div>

          <div id="entries-list" class="entries-list"></div>

          <div id="live-region" class="live-region" hidden>
            <div id="live-generation" class="live-generation" hidden></div>
            <div id="live-tools" class="live-tools" hidden></div>
            <div id="live-inbox" class="live-inbox" hidden></div>
            <div id="run-failure-banner" class="run-failure-banner" hidden></div>
          </div>
        </section>

        <footer class="composer-wrap">
          <form id="composer-form" class="composer-form">
            <textarea
              id="prompt-input"
              class="composer-input"
              rows="3"
              placeholder="Message H… (Enter to send, Shift+Enter for newline, Esc to stop)"
              disabled
            ></textarea>
            <div class="composer-actions">
              <div class="composer-left">
                <span id="pending-status" class="pending-status" hidden></span>
                <button id="retry-pending-btn" type="button" class="btn btn-sm btn-secondary" hidden>
                  Retry
                </button>
              </div>
              <div class="composer-right">
                <button id="steer-btn" type="button" class="btn btn-secondary" hidden>
                  Steer
                </button>
                <button id="send-btn" type="submit" class="btn btn-primary" disabled>
                  Send
                </button>
              </div>
            </div>
          </form>
        </footer>
      </main>
    </div>
  </body>
</html>
