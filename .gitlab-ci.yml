# H (:harness) CI & Multi-Platform Release Pipeline
#
# Targets GitLab SaaS shared Linux runners (`saas-linux-medium-amd64`,
# `saas-linux-medium-arm64`) and an opt-in macOS Apple Silicon runner
# (`h-macos-arm64`, or `H_MACOS_RUNNER_TAG` override).
#
# Release builds run automatically on version tags (`v*`) and can be triggered
# manually on `main` or feature branches for pre-release verification.

stages:
  - test
  - build
  - release
  - pages

variables:
  ELIXIR_TEST_IMAGE: "elixir:1.20.5-otp-29"
  ELIXIR_IMAGE: "hexpm/elixir:1.20.5-erlang-29.1.2-debian-bookworm-20261104"
  RUST_IMAGE: "rust:1-bookworm"
  RUBY_IMAGE: "ruby:3.3-bookworm"
  RUST_VERSION: "stable"
  NODE_MAJOR: "22"
  MIX_ENV: "test"
  CARGO_TERM_COLOR: "always"
  BUNDLE_JOBS: "4"
  BUNDLE_RETRY: "3"

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Stage 1: Test
# ---------------------------------------------------------------------------

test:elixir:
  stage: test
  tags: [saas-linux-medium-amd64]
  image: ${ELIXIR_TEST_IMAGE}
  before_script:
    - mix local.hex --force
    - mix local.rebar --force
  script:
    - mix deps.get --check-locked
    - mix format --check-formatted
    - mix compile --warnings-as-errors
    - mix test
    - MIX_ENV=dev mix docs --warnings-as-errors --output /tmp/hiness-docs
    - |
      (
        cd clients/web
        mix deps.get --check-locked
        mix compile --warnings-as-errors
        mix test
      )
    - |
      (
        cd installer
        mix format --check-formatted
        mix compile --warnings-as-errors
        mix test
        MIX_ENV=docs mix deps.get --check-locked
        MIX_ENV=docs mix docs --warnings-as-errors --output /tmp/h-setup-docs
      )

test:rust:
  stage: test
  tags: [saas-linux-medium-amd64]
  image: ${RUST_IMAGE}
  script:
    - cargo test --locked --manifest-path clients/tui/Cargo.toml
    - cargo test --locked --manifest-path clients/import/Cargo.toml

test:websites:
  stage: test
  tags: [saas-linux-medium-amd64]
  image: ${RUBY_IMAGE}
  rules:
    - exists:
        - websites/hiness.dev/scripts/verify_site.rb
        - websites/hiness.app/scripts/verify_site.rb
      when: on_success
    - when: never
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg openssh-client python3
    - curl -fsSL "https://deb.nodesource.com/setup_${NODE_MAJOR}.x" | bash -
    - apt-get install -y -qq --no-install-recommends nodejs
  script:
    - python3 scripts/test-install-sh.py
    - diff -u scripts/install.sh websites/hiness.dev/install.sh
    - |
      for site in websites/hiness.dev websites/hiness.app; do
        (
          cd "$site"
          npm ci --prefer-offline --ignore-scripts --no-audit --fund=false
          bundle config set --local frozen true
          bundle install
          make verify
          make verify-prod
        )
      done

# ---------------------------------------------------------------------------
# Stage 2: Native Multi-Platform Bundles
# ---------------------------------------------------------------------------

.bundle_rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - when: manual
      allow_failure: true

.linux_bundle_template:
  stage: build
  image: ${ELIXIR_IMAGE}
  extends: .bundle_rules
  variables:
    MIX_ENV: "prod"
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - |
      DEBIAN_FRONTEND=noninteractive apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
        build-essential ca-certificates curl git gnupg patchelf pkg-config procps python3 xz-utils
      curl -fsSL "https://deb.nodesource.com/setup_${NODE_MAJOR}.x" | DEBIAN_FRONTEND=noninteractive bash -
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends nodejs
      curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}"
      export PATH="$HOME/.cargo/bin:$PATH"
      mix local.hex --force
      mix local.rebar --force
  script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - export H_GIT_COMMIT="${CI_COMMIT_SHA}"
    - export H_GIT_TAG="${CI_COMMIT_TAG:-}"
    - mkdir -p dist/release
    - scripts/build-bundle.sh "dist/bundle-${H_RELEASE_TARGET}"
    - python3 -B scripts/smoke-bundle.py "dist/bundle-${H_RELEASE_TARGET}"
    - scripts/package-release.sh "dist/bundle-${H_RELEASE_TARGET}" dist/release
  artifacts:
    name: "harness-${H_RELEASE_TARGET}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/release/harness-*.tar.gz
    expire_in: 14 days

bundle:linux-x86_64:
  extends: .linux_bundle_template
  tags: [saas-linux-medium-amd64]
  variables:
    H_RELEASE_TARGET: "linux-x86_64"

bundle:installer-archive:
  stage: build
  tags: [saas-linux-medium-amd64]
  image: ${ELIXIR_IMAGE}
  extends: .bundle_rules
  variables:
    MIX_ENV: "prod"
  before_script:
    - mix local.hex --force
    - mix local.rebar --force
  script:
    - mkdir -p dist/release
    - |
      cd installer
      mix compile --warnings-as-errors
      mix archive.build --force -o ../dist/release/h_setup.ez
      cp ../dist/release/h_setup.ez "../dist/release/h_setup-v$(mix run -e 'IO.write(Mix.Project.config()[:version])').ez"
  artifacts:
    name: "h-setup-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/release/h_setup*.ez
    expire_in: 14 days

bundle:linux-arm64:
  extends: .linux_bundle_template
  tags: [saas-linux-medium-arm64]
  variables:
    H_RELEASE_TARGET: "linux-arm64"

bundle:darwin-arm64:
  stage: build
  tags: [h-macos-arm64]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/ && $H_ENABLE_MACOS_RUNNER == "1"'
    - when: manual
      allow_failure: true
  variables:
    MIX_ENV: "prod"
    HOMEBREW_NO_AUTO_UPDATE: "1"
    H_RELEASE_TARGET: "darwin-arm64"
  before_script:
    - |
      eval "$(/opt/homebrew/bin/brew shellenv)"
      export PATH="$HOME/.cargo/bin:/opt/homebrew/nodenv/shims:$PATH"
      for cmd in elixir cargo node python3 swiftc; do
        command -v "$cmd" >/dev/null 2>&1 || { echo "Missing required tool on macOS runner: $cmd" >&2; exit 1; }
      done
      elixir --version
      cargo --version
      node --version
      swiftc --version
      mix local.hex --force
      mix local.rebar --force
  script:
    - eval "$(/opt/homebrew/bin/brew shellenv)"
    - export PATH="$HOME/.cargo/bin:/opt/homebrew/nodenv/shims:$PATH"
    - export H_GIT_COMMIT="${CI_COMMIT_SHA}"
    - export H_GIT_TAG="${CI_COMMIT_TAG:-}"
    - rm -rf dist/bundle-darwin-arm64 dist/release
    - mkdir -p dist/release
    - scripts/build-bundle.sh "dist/bundle-darwin-arm64"
    - python3 -B scripts/smoke-bundle.py "dist/bundle-darwin-arm64"
    - scripts/package-release.sh "dist/bundle-darwin-arm64" dist/release
    - scripts/build-macos-app.sh "dist/bundle-darwin-arm64" dist/release
  artifacts:
    name: "harness-darwin-arm64-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/release/harness-*.tar.gz
      - dist/release/H-*.dmg
      - dist/release/H-*.app.zip
    expire_in: 14 days

# ---------------------------------------------------------------------------
# Stage 3: Sign, Verify & Publish Release (tags `v*`)
# ---------------------------------------------------------------------------

release:publish:
  stage: release
  tags: [saas-linux-medium-amd64]
  image: debian:bookworm-slim
  needs:
    - job: bundle:linux-x86_64
      artifacts: true
    - job: bundle:linux-arm64
      artifacts: true
    - job: bundle:installer-archive
      artifacts: true
    - job: bundle:darwin-arm64
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - |
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends ca-certificates curl git openssh-client python3
  script:
    - export H_GIT_COMMIT="${CI_COMMIT_SHA}"
    - export H_GIT_TAG="${CI_COMMIT_TAG}"
    - |
      if [ -n "${H_RELEASE_SIGNING_KEY:-}" ]; then
        if [ -f "${H_RELEASE_SIGNING_KEY}" ]; then
          export H_SIGNING_KEY="${H_RELEASE_SIGNING_KEY}"
        else
          export H_SIGNING_KEY_PEM="${H_RELEASE_SIGNING_KEY}"
        fi
        scripts/sign-release.sh dist/release
        scripts/verify-release.sh dist/release
      else
        export H_ALLOW_UNSIGNED=1
        scripts/sign-release.sh dist/release
        scripts/verify-release.sh dist/release
      fi
    - scripts/ci/gitlab-release.sh dist/release
  artifacts:
    name: "harness-release-${CI_COMMIT_TAG}"
    paths:
      - dist/release/SHA256SUMS
      - dist/release/SHA256SUMS.sig
      - dist/release/release-manifest.json
      - dist/release/release-manifest.json.sig
    expire_in: 90 days

release:hex:
  stage: release
  tags: [saas-linux-medium-amd64]
  image: ${ELIXIR_TEST_IMAGE}
  needs:
    - job: release:publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - mix local.hex --force
    - mix local.rebar --force
  script:
    - |
      if [ -n "${HEX_API_KEY:-}" ]; then
        MIX_ENV=dev mix deps.get --check-locked
        MIX_ENV=dev mix hex.publish --yes
        (
          cd installer
          MIX_ENV=docs mix deps.get --check-locked
          MIX_ENV=docs mix hex.publish --yes
        )
      else
        echo "HEX_API_KEY not configured; skipping automated Hex publish"
      fi

# ---------------------------------------------------------------------------
# Stage 4: Websites (Cloudflare Pages deploy for hiness.dev & hiness.app)
# ---------------------------------------------------------------------------

.cloudflare_site_deploy:
  stage: pages
  tags: [saas-linux-medium-amd64]
  image: ${RUBY_IMAGE}
  resource_group: ${CF_PAGES_PROJECT}
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN'
      when: on_success
    - when: never
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg
    - curl -fsSL "https://deb.nodesource.com/setup_${NODE_MAJOR}.x" | bash -
    - apt-get install -y -qq --no-install-recommends nodejs
  script:
    - |
      cd "${SITE_DIR}"
      npm ci --prefer-offline --ignore-scripts --no-audit --fund=false
      bundle config set --local frozen true
      bundle install
      make verify-prod DESTINATION=_site
      npx --yes wrangler@4 pages deploy _site --project-name="${CF_PAGES_PROJECT}" --branch="${CI_COMMIT_BRANCH}"

deploy:hiness-dev:
  extends: .cloudflare_site_deploy
  variables:
    SITE_DIR: "websites/hiness.dev"
    CF_PAGES_PROJECT: "hiness-dev"
  environment:
    name: hiness.dev
    url: https://hiness.dev

deploy:hiness-app:
  extends: .cloudflare_site_deploy
  variables:
    SITE_DIR: "websites/hiness.app"
    CF_PAGES_PROJECT: "hiness-app"
  environment:
    name: hiness.app
    url: https://hiness.app
