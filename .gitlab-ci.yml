# Opt in on a native shell runner with Elixir 1.20 / OTP 29, Rust, Hex, and
# Python 3 (plus Xcode command-line tools for macOS native library packaging).
# Select the runner's OS/arch with its tags, not with cross-compilation here.
bundle:
  stage: build
  tags: [h-native]
  rules:
    - when: manual
  allow_failure: true
  script:
    - mix h.bundle "dist/harness-${CI_JOB_ID}"
  artifacts:
    name: "harness-${CI_COMMIT_SHORT_SHA}-${CI_RUNNER_ID}"
    paths:
      - dist/harness-${CI_JOB_ID}/
    expire_in: 7 days
