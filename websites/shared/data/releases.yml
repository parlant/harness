entries:
  - version: "0.5.3"
    tag: "v0.5.3"
    date: "2026-11-28"
    status: "Current release"
    title: "Native Sparkle 2 auto-updates for H.app"
    summary: "H.app integrates Sparkle 2 to check for signed macOS updates automatically, announce new releases gently in the menu bar, display release notes, and cleanly drain the daemon before relaunching."
    artifacts:
      - name: "H-v0.5.3-darwin-arm64.dmg"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "macOS Disk Image (H.app)"
      - name: "H-v0.5.3-darwin-arm64.app.zip"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Zipped macOS Application Bundle"
      - name: "harness-v0.5.3-darwin-arm64.tar.gz"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.5.3-linux-arm64.tar.gz"
        platform: "Linux aarch64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.5.3-linux-x86_64.tar.gz"
        platform: "Linux x86_64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "h_setup-v0.5.3.ez"
        platform: "Elixir 1.18+ / Mix"
        kind: "Signed Mix Archive Installer"
    highlights:
      - "Embed Sparkle 2 (`Sparkle.framework`) in `H.app` with Developer ID inside-out signing, hardened runtime, and Apple notarization."
      - "Add Check for Updates (`⌘U`), automatic check toggle, and gentle menu-bar update reminders (`H↑`) that open Sparkle's native release notes and install dialog."
      - "Drain and stop the bundled `hi-exec` daemon cleanly before Sparkle replaces `H.app` and relaunches."
      - "Publish an Ed25519-signed `appcast.xml` automatically with every GitHub and GitLab release."

  - version: "0.5.2"
    tag: "v0.5.2"
    date: "2026-11-28"
    status: "Previous release"
    title: "Notarized macOS builds and automatic browser sign-in"
    summary: "Developer ID-sign, notarize, and staple H.app, the .dmg, and the .app.zip for Gatekeeper, and automatically sign into the web workbench from H.app using short-lived single-use links."
    artifacts:
      - name: "H-v0.5.2-darwin-arm64.dmg"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "macOS Disk Image (H.app)"
      - name: "H-v0.5.2-darwin-arm64.app.zip"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Zipped macOS Application Bundle"
      - name: "harness-v0.5.2-darwin-arm64.tar.gz"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.5.2-linux-arm64.tar.gz"
        platform: "Linux aarch64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.5.2-linux-x86_64.tar.gz"
        platform: "Linux x86_64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "h_setup-v0.5.2.ez"
        platform: "Elixir 1.18+ / Mix"
        kind: "Signed Mix Archive Installer"
    highlights:
      - "Notarize and staple `H.app` before packaging `.app.zip` and `.dmg`, then sign, notarize, and staple the `.dmg` so Gatekeeper accepts downloads cleanly."
      - "Mint 60-second single-use sign-in codes via `POST /api/v1/auth/sign-in-link` and redeem them at `/login/link` to land directly on `/workspaces` without exposing the owner token."

  - version: "0.5.1"
    tag: "v0.5.1"
    date: "2026-11-26"
    status: "Previous release"
    title: "Prevent hi CPU spin on terminal disconnect"
    summary: "Fix an infinite read loop in the terminal client when its PTY closes, and exit cleanly on SIGHUP or terminal hangup."
    artifacts:
      - name: "H-v0.5.1-darwin-arm64.dmg"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "macOS Disk Image (H.app)"
      - name: "H-v0.5.1-darwin-arm64.app.zip"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Zipped macOS Application Bundle"
      - name: "harness-v0.5.1-darwin-arm64.tar.gz"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.5.1-linux-arm64.tar.gz"
        platform: "Linux aarch64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.5.1-linux-x86_64.tar.gz"
        platform: "Linux x86_64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "h_setup-v0.5.1.ez"
        platform: "Elixir 1.18+ / Mix"
        kind: "Signed Mix Archive Installer"
    highlights:
      - "Enable crossterm's `use-dev-tty` backend so PTY EOF breaks out of event polling instead of spinning in `read()`."
      - "Handle `SIGHUP` and check stdin for `POLLHUP`/`POLLERR`/`POLLNVAL` in `hi`'s event loop so disconnected terminals exit cleanly."

  - version: "0.5.0"
    tag: "v0.5.0"
    date: "2026-11-26"
    status: "Previous release"
    title: "Subagent wait visibility and quieter catalog streams"
    summary: "The terminal and web clients identify awaited subagents and surface their provider blockers. The daemon avoids repeated idle catalog snapshots and redundant workspace checks."
    artifacts:
      - name: "H-v0.5.0-darwin-arm64.dmg"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "macOS Disk Image (H.app)"
      - name: "H-v0.5.0-darwin-arm64.app.zip"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Zipped macOS Application Bundle"
      - name: "harness-v0.5.0-darwin-arm64.tar.gz"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.5.0-linux-arm64.tar.gz"
        platform: "Linux aarch64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.5.0-linux-x86_64.tar.gz"
        platform: "Linux x86_64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "h_setup-v0.5.0.ez"
        platform: "Elixir 1.18+ / Mix"
        kind: "Signed Mix Archive Installer"
    highlights:
      - "Show provider retries through active wait and await dependencies without marking detached subagents or unrelated conversations as blockers."
      - "Recover slow SSE clients based on actual queued frames, not connection process memory."
      - "Ship a native macOS helper for daemon launch and isolate host directory enumeration from the OTP file server."

  - version: "0.4.0"
    tag: "v0.4.0"
    date: "2026-11-26"
    status: "Previous release"
    title: "Parked approval and signal gates, run budgets, HTTP remote agents, and hi cutover"
    summary: "Pause mutating tools for owner approval or wait on external wake signals inside the session coordinator, enforce turn-boundary run budgets, run standalone remote execution agents over authenticated HTTP or Unix sockets, and connect hiweb out-of-VM."
    artifacts:
      - name: "H-v0.4.0-darwin-arm64.dmg"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "macOS Disk Image (H.app)"
      - name: "H-v0.4.0-darwin-arm64.app.zip"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Zipped macOS Application Bundle"
      - name: "harness-v0.4.0-darwin-arm64.tar.gz"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.4.0-linux-arm64.tar.gz"
        platform: "Linux aarch64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.4.0-linux-x86_64.tar.gz"
        platform: "Linux x86_64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "h_setup-v0.4.0.ez"
        platform: "Elixir 1.18+ / Mix"
        kind: "Signed Mix Archive Installer"
    highlights:
      - "Park mutating or selected tools for owner approval (/approve and /deny) and wait on external HTTP signals (wait_signal) inside H.Session.Server with zero idle worker processes."
      - "Configure per-run turn, USD cost, and elapsed-time budgets (/budget) and cancel individual tool or subagent tasks (/abort <task_id>) while keeping sibling calls running."
      - "Run h-daemon remote-agent over bearer-authenticated HTTP or Unix sockets with attempt fencing, lease heartbeats, and OS process-group reaping."
      - "Connect hiweb to an external daemon process through HWeb.Backend.HTTP and its supervised catalog and conversation SSE bridges."
      - "Discover startup harness profiles (GET /api/v1/harnesses), read cached extension status projections in hi and hiweb, and pair live editor buffers through the optional EditorHost package."
      - "Remove stored Codex or API-key credentials (hi logout and hi key remove), load custom JSON themes and /prompt:<name> templates, and preview inline PNG or JPEG images in Kitty and iTerm2 regular terminal mode."

  - version: "0.3.0"
    tag: "v0.3.0"
    date: "2026-11-25"
    status: "Previous release"
    title: "Web workbench updates and idle session unloading"
    summary: "Update the terminal and web clients together with the signed macOS or Linux bundle. The daemon unloads idle sessions from memory and wakes them when a request needs them."
    artifacts:
      - name: "H-v0.3.0-darwin-arm64.dmg"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "macOS Disk Image (H.app)"
      - name: "H-v0.3.0-darwin-arm64.app.zip"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Zipped macOS Application Bundle"
      - name: "harness-v0.3.0-darwin-arm64.tar.gz"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.3.0-linux-arm64.tar.gz"
        platform: "Linux aarch64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.3.0-linux-x86_64.tar.gz"
        platform: "Linux x86_64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "h_setup-v0.3.0.ez"
        platform: "Elixir 1.18+ / Mix"
        kind: "Signed Mix Archive Installer"
    highlights:
      - "Browse nearby Inbox sessions and edit tags in the session sidebar."
      - "Drop attachments into the composer or edit and resend a prompt to start a separate branch."
      - "Expand grouped tool calls to inspect their output, or open a child conversation from its subagent card."
      - "Keep workspace catalog queries available while idle session processes unload."
      - "Preserve tool-call exchanges when continuing imported sessions in hi and hiweb."

  - version: "0.1.0"
    tag: "v0.1.0"
    date: "2026-11-23"
    status: "Previous release"
    title: "Signed standalone bundles, POSIX installer, and H.app for macOS"
    summary: "Initial public packaging of the self-contained BEAM release, Rust hi and hi-import clients, Phoenix LiveView hiweb workbench, and native Swift menu-bar app."
    artifacts:
      - name: "H-v0.1.0-darwin-arm64.dmg"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "macOS Disk Image (H.app)"
      - name: "H-v0.1.0-darwin-arm64.app.zip"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Zipped macOS Application Bundle"
      - name: "harness-v0.1.0-darwin-arm64.tar.gz"
        platform: "macOS 14+ (Apple Silicon)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.1.0-linux-arm64.tar.gz"
        platform: "Linux aarch64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "harness-v0.1.0-linux-x86_64.tar.gz"
        platform: "Linux x86_64 (glibc)"
        kind: "Standalone CLI & OTP Daemon Tarball"
      - name: "h_setup-v0.1.0.ez"
        platform: "Elixir 1.18+ / Mix"
        kind: "Signed Mix Archive Installer"
    highlights:
      - "Package self-contained ERTS, Elixir daemon, hiweb Phoenix workbench, and Rust hi + hi-import binaries per target."
      - "Add H.app native AppKit menu-bar launcher (co.parlant.harness) with one-click hiweb launch, owner token copy, PATH symlink installer, and graceful daemon drain."
      - "Sign SHA256SUMS and release-manifest.json with OpenSSH Ed25519 keys verified by install.sh and mix h.setup."
      - "Scale daemon drain timeouts dynamically and cascade writable PATH bin directories during CLI installation."
