<!doctype html>
{% assign lang = page.lang | default: site.lang %}
{% assign t = site.data.i18n[lang] %}
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if site.preview %}<meta name="robots" content="noindex, nofollow">{% endif %}
    {% seo %}
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32">
    <link rel="icon" href="{{ '/assets/icons/h.svg' | relative_url }}" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}" sizes="180x180">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip" href="#content">{{ t.skip }}</a>
    {% include header.html t=t %}
    <main id="content" tabindex="-1">{{ content }}</main>
    {% include footer.html t=t %}
  </body>
</html>
