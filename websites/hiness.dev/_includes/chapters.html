<nav aria-label="{{ site.data.i18n.en.chapter_navigation }}" class="chapter-links">
  {% for group in site.data.manual %}<p>{{ group.title }}</p><ul>
    {% for item in group.pages %}<li><a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a></li>{% endfor %}
  </ul>{% endfor %}
</nav>
