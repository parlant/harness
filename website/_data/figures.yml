extension:
  number: Fig. 03
  title: From package to session
  steps:
    - title: Author builds
      artifact: 'extension.json + ebin/'
      note: The package supplies a manifest and compiled modules, not a running daemon.
    - title: Owner enables
      artifact: extensions.json
      note: At startup H loads the selected local artifact with the daemon’s authority. A workspace cannot enable it.
    - title: Session selects
      artifact: harness_id
      note: A client can request a registered profile. The coordinator still owns commits and task recovery.
  caption: Building an artifact does not enable it. Selecting a profile does not install code.
