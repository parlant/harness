lifetimes:
  number: Fig. 02
  title: Four lifetimes
  intro: H keeps history ancestry, active task ownership, process supervision, and client reading position in four separate structures.
  instruction: Open a row to inspect what each structure owns.
  entries:
    - name: History ancestry
      shape: branch
      question: Which entries can I see?
      body: A conversation inherits its parent's visible prefix through the selected entry. Appending new turns extends the branch while leaving the parent path intact.
    - name: Work ownership
      shape: tasks
      question: Which run owns the work?
      body: An active generation owns its in-flight tool calls. When you fork at an earlier entry, running tasks continue under the conversation that started them.
    - name: OTP supervision
      shape: supervision
      question: Which processes restart together?
      body: A per-session supervisor groups the session coordinator and its workers. When a process restarts, the coordinator reloads committed state from disk and flags any interrupted shell command for your review.
    - name: Client cursor
      shape: cursor
      question: Where am I reading?
      body: Each client tracks its own selected session, branch, and page cursor. Scrolling or switching branches in one window leaves stored history and other attached clients where they are.
