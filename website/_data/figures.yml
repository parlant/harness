extension:
  number: Fig. 03
  title: From package to session
  steps:
    - title: Build the package
      artifact: 'extension.json + ebin/'
      note: Compile the extension project into a standalone directory containing its manifest and BEAM modules.
    - title: Enable at startup
      artifact: extensions.json
      note: List the built artifact path in the daemon data directory so H loads it with daemon authority on boot.
    - title: Select in a session
      artifact: harness_id
      note: Request the registered profile when creating a session while the session coordinator retains commit and recovery control.
  caption: Compile the artifact, enable its path in extensions.json, and select its registered ID when starting a session.
