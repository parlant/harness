lifetimes:
  number: Fig. 02
  title: Four lifetimes
  intro: A fork changes which entries a conversation sees. It does not duplicate a task, restart a worker, or move another reader’s cursor.
  instruction: Open a row to inspect its boundary.
  entries:
    - name: History ancestry
      shape: branch
      question: Which entries can I see?
      body: A conversation inherits its parent’s visible prefix through the selected entry. New entries extend that conversation without changing its parent.
    - name: Work ownership
      shape: tasks
      question: Which run owns the work?
      body: A generation can own tool calls. Forking at an earlier entry neither copies nor cancels those tasks; they still belong to the run that started them.
    - name: OTP supervision
      shape: supervision
      question: Which processes restart together?
      body: A per-session supervisor groups the coordinator and its workers. Restarting a process does not rewind the transcript or grant permission to repeat an interrupted shell command.
    - name: Client cursor
      shape: cursor
      question: Where am I reading?
      body: Each client chooses its own session, branch, and page. Moving one cursor leaves both the stored entries and the other client’s view alone.
