{% assign item = include.section %}
<section class="manual-section operating-note" aria-labelledby="{{ item.id }}-heading">
  <div>
    <p class="manual-kicker">{{ item.kicker }}</p>
    <h2 class="manual-title" id="{{ item.id }}-heading">{{ item.title }}</h2>
  </div>
  <div>
    <p class="manual-lead">{{ item.body }}</p>
    <ul class="principle-links">
      {% for link in item.links %}
      <li><a class="manual-secondary" href="{{ link.url | relative_url }}">{{ link.label }} <span aria-hidden="true">→</span></a></li>
      {% endfor %}
    </ul>
  </div>
</section>
